name: Build macOS App

# Feuert automatisch, sobald publish_release.ps1 (auf JJs Windows-Rechner)
# ein neues Release veroeffentlicht - JJ muss dafuer nichts extra tun, ein
# Doppelklick auf build_installer.bat reicht fuer beide Plattformen.
# workflow_dispatch bleibt zusaetzlich als manueller Testknopf.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag, an das der Mac-Build angehaengt werden soll (leer = neuestes Release)'
        required: false

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pyinstaller

      - name: Programmsymbol nach .icns umwandeln (optional)
        continue-on-error: true
        run: |
          # PyInstaller braucht unter macOS eine .icns-Datei, im Projekt liegt
          # nur eine .ico fuer Windows. sips kann das umwandeln. Schlaegt es
          # fehl, wird der Build trotzdem fortgesetzt, nur eben mit dem
          # Standardsymbol, das ist reine Kosmetik und darf die
          # Veroeffentlichung nicht blockieren.
          sips -s format icns assets/icons/app/novaflow.ico --out NovaFlow.icns

      - name: Build with PyInstaller
        run: |
          # --osx-bundle-identifier ist NICHT optional: macOS merkt sich
          # erteilte Berechtigungen (Mikrofon, Bedienungshilfen) pro
          # Bundle-ID. Ohne feste ID vergibt PyInstaller bei jedem Build eine
          # andere und der Nutzer muesste NovaFlow nach jedem Update erneut
          # freischalten. Dieselbe ID nutzt auch der LaunchAgent fuer den
          # Autostart, siehe src/platforms/macos.py (LAUNCH_AGENT_LABEL).
          ICON_ARG=""
          if [ -f NovaFlow.icns ]; then
            ICON_ARG="--icon NovaFlow.icns"
          fi
          pyinstaller --noconfirm --windowed --name NovaFlow \
            --osx-bundle-identifier eu.kiw-schmiede.novaflow \
            $ICON_ARG \
            --paths src \
            --add-data "assets:assets" \
            --add-data ".env.example:." \
            --add-data "VERSION:." \
            --hidden-import AppKit \
            --hidden-import Foundation \
            --hidden-import objc \
            --hidden-import PyQt6.QtSvg \
            --collect-all ctranslate2 \
            --collect-all faster_whisper \
            --collect-all tokenizers \
            --collect-all huggingface_hub \
            novaflow.pyw

      - name: Info.plist ergaenzen (Mikrofonzugriff, Hintergrund-App)
        run: |
          PLIST="dist/NovaFlow.app/Contents/Info.plist"

          # NSMicrophoneUsageDescription ist unter macOS PFLICHT. Fehlt der
          # Eintrag, verweigert das Betriebssystem den Mikrofonzugriff nicht
          # etwa mit einer Meldung, sondern beendet die Anwendung hart.
          # NovaFlow waere damit auf dem Mac schlicht unbenutzbar.
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'NovaFlow benoetigt Zugriff auf das Mikrofon, um dein Diktat aufzunehmen und in Text umzuwandeln.'" "$PLIST"

          # NovaFlow ist eine reine Menueleisten-Anwendung ohne eigenes
          # Hauptfenster, genau wie unter Windows im Tray. LSUIElement sorgt
          # dafuer, dass sie nicht zusaetzlich im Dock auftaucht.
          /usr/libexec/PlistBuddy -c "Delete :LSUIElement" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" "$PLIST"

          echo "--- fertige Info.plist ---"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | head -40

      - name: Package as .dmg
        run: |
          # Staging-Ordner mit App UND Deinstallations-Skript zusammen, da
          # hdiutil create nur einen einzigen -srcfolder akzeptiert. Ohne
          # dieses Skript gaebe es auf dem Mac (anders als unter Windows mit
          # Inno Setup) ueberhaupt keine Moeglichkeit, NovaFlow sauber wieder
          # loszuwerden.
          mkdir -p dist/dmg_staging
          cp -R dist/NovaFlow.app dist/dmg_staging/
          cp "packaging/macos/Uninstall NovaFlow.command" dist/dmg_staging/
          chmod +x "dist/dmg_staging/Uninstall NovaFlow.command"
          ls -la dist/dmg_staging
          hdiutil create -volname "NovaFlow" -srcfolder dist/dmg_staging -ov -format UDZO dist/NovaFlow-Setup.dmg

      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName' --repo "${{ github.repository }}")
            echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" dist/NovaFlow-Setup.dmg --repo "${{ github.repository }}" --clobber
